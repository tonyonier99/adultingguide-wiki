<style>
:root{--orange:#E65100;--cream:#FBF1E7;--ink:#453F3A;--sub:#8A817A;--line:#EDE4D9;--paper:#FBF6F1;--measure:43.75rem}*{margin:0;padding:0;box-sizing:border-box}body{font-family:"PingFang TC","Noto Sans TC",system-ui,sans-serif;color:var(--ink);background:var(--paper);font-size:1.125rem;line-height:1.95;letter-spacing:.02em;-webkit-font-smoothing:antialiased}a{color:var(--orange);text-decoration:none}a:hover{text-decoration:underline}.wrap{max-width:var(--measure);margin:0 auto;padding:0 1.25rem}header.site{border-bottom:1px solid var(--line);padding:.7rem 0;background:var(--paper);position:sticky;top:0;z-index:10}header.site .wrap{display:flex;align-items:center;gap:.75rem}.brand{display:flex;align-items:center;gap:.55rem;min-width:0}.brand:hover{text-decoration:none}.logo-icon{width:34px;height:34px;border-radius:8px;flex:none}.logo{font-weight:800;font-size:1.05rem;color:var(--ink);white-space:nowrap}.logo span{color:var(--orange)}.site-nav{margin-left:auto;display:flex;justify-content:flex-end;flex-wrap:wrap;gap:.25rem 1rem}.site-nav a{font-size:.88rem;font-weight:700;color:var(--sub);white-space:nowrap}.site-nav a.on{color:var(--orange)}main{padding:0 0 3.5rem}.page-head{padding-top:2rem}.eyebrow{display:inline-block;color:var(--orange);font-size:.8rem;font-weight:800;letter-spacing:.08em}.page-head h1{font-size:2rem;line-height:1.4;letter-spacing:.01em;font-weight:800;margin-top:.3rem}.lead{color:var(--sub);margin-top:.6rem}.form{margin-top:1.4rem;background:#fff;border:1px solid var(--line);border-radius:16px;padding:1.2rem}.form label{display:block;font-size:.93rem;font-weight:800;margin-top:1rem}.form label:first-child{margin-top:0}.req{color:var(--orange)}input,select,textarea{width:100%;font:inherit;font-size:.92rem;line-height:1.6;border:1px solid #D9CDC0;border-radius:9px;padding:.55rem .7rem;color:var(--ink);background:#fff;margin-top:.25rem}textarea{resize:vertical}.hint{font-size:.8rem;color:var(--sub);font-weight:500}.btn{margin-top:1.2rem;background:var(--orange);border:0;border-radius:10px;color:#fff;font:inherit;font-size:.92rem;font-weight:800;padding:.6rem 1rem;cursor:pointer}.btn:hover{background:#bd4700}.note{margin-top:1.2rem;background:var(--cream);border-radius:14px;padding:1rem 1.1rem;font-size:.9rem}.note h2{font-size:1rem}.note p{margin-top:.3rem;color:var(--sub)}footer.site{border-top:1px solid var(--line);padding:1.4rem 0;background:#fff}.foot-nav{display:flex;flex-wrap:wrap;gap:.35rem 1rem}.foot-nav a{font-size:.86rem;color:var(--sub);font-weight:700}.foot-legal{color:var(--sub);font-size:.76rem;line-height:1.65;margin-top:1rem}@media(max-width:620px){header.site .wrap{align-items:flex-start}.site-nav{margin-left:0}.page-head h1{font-size:1.75rem}}

.page-head,.form,.note{animation:fadeUp .5s cubic-bezier(.2,.7,.2,1) both}.form{animation-delay:.08s}.note{animation-delay:.16s}.btn{transition:transform .2s cubic-bezier(.2,.7,.2,1),background .2s}.btn:hover{transform:translateY(-2px)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<body>
<header class="site"><div class="wrap"><a class="brand" href="./"><img class="logo-icon" src="assets/app-icon.png" alt=""><span class="logo">初級大人<span>手冊</span></span></a><nav class="site-nav" aria-label="主要導覽"><a href="wiki">百科</a><a href="community/">社群</a><a href="group-buy">團購</a><a href="picks">島嶼地圖</a><a href="updates">更新日誌</a><a href="feedback" class="on">回報／建議</a></nav></div></header>
<main><div class="wrap"><section class="page-head"><h1>回報／建議</h1><p class="lead">找不到功能、看到錯誤，或有想敲碗的事，都可以從這裡說。送出後會開啟你的 Email，確認寄出即可。</p></section><form class="form" id="feedback-form"><label>回報類型 <span class="req">*</span><select name="type" required><option value="">請選擇</option><option>App 錯誤</option><option>內容勘誤</option><option>找不到功能</option><option>功能建議</option><option>其他</option></select></label><label>標題 <span class="req">*</span><input name="title" required maxlength="80" placeholder="一句話說明問題或建議"></label><label>發生在哪裡 <span class="hint">（選填）</span><input name="where" maxlength="160" placeholder="例：首頁、食材價格、某篇文章、社群貼文"></label><label>詳細說明 <span class="req">*</span><textarea name="detail" required rows="5" maxlength="2000" placeholder="如果是錯誤：你做了什麼、預期看到什麼、實際發生什麼？"></textarea></label><label>裝置與 App 版本 <span class="hint">（選填）</span><input name="device" maxlength="160" placeholder="例：iPhone 15、iOS 18、App 1.0.0"></label><label>截圖連結 <span class="hint">（選填）</span><input name="screenshot" type="url" placeholder="可貼 iCloud、Google Drive 等分享連結"></label><label>方便回覆的 Email <span class="hint">（選填）</span><input name="email" type="email" placeholder="name@example.com"></label><button class="btn" type="submit">整理後開啟 Email</button></form><section class="note"><h2>送出之後</h2><p>我們會先查核與分類；可公開的處理結果會整理到<a href="updates">更新日誌</a>，不會公開你的姓名、Email 或原始內容。</p></section></div></main>
<footer class="site"><div class="wrap"><nav class="foot-nav"><a href="search">搜尋</a><a href="about">關於</a><a href="support">支援</a><a href="privacy">隱私政策</a><a href="terms">使用條款</a><a href="https://apps.apple.com/app/apple-store/id6763735472?pt=128418142&amp;ct=Website&amp;mt=8" rel="noopener">下載 App</a></nav><p class="foot-legal">內容僅供生活參考，實際金額、期限與規定以各主管機關當年公告為準。<br>© 2026 初級大人手冊</p></div></footer>
<script>
document.getElementById('feedback-form').addEventListener('submit', function (event) {
  event.preventDefault();
  var form = event.currentTarget;
  var fields = [
    ['類型', form.type.value], ['標題', form.title.value], ['發生位置', form.where.value || '—'],
    ['詳細說明', form.detail.value], ['裝置／版本', form.device.value || '—'],
    ['截圖連結', form.screenshot.value || '—'], ['回覆 Email', form.email.value || '—']
  ];
  var body = fields.map(function (field) { return '【' + field[0] + '】\n' + field[1]; }).join('\n\n');
  window.location.href = 'mailto:tonyonier99@gmail.com?subject=' + encodeURIComponent('網站回報｜' + form.type.value + '｜' + form.title.value) + '&body=' + encodeURIComponent(body);
});
</script>
